<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | NEXA</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        font-family: Arial, sans-serif;
        color: #172b4d;
        background: #f1f6ff;
    }

    .card {
        width: 100%;
        max-width: 430px;
        padding: 32px;
        background: white;
        border-radius: 18px;
        box-shadow: 0 15px 45px #183c7218;
    }

    .brand {
        margin-bottom: 25px;
        color: #0866ff;
        text-align: center;
        font-size: 38px;
        font-weight: 900;
        letter-spacing: 5px;
    }

    h1 {
        font-size: 25px;
        text-align: center;
    }

    p {
        color: #718096;
        line-height: 1.6;
    }

    label {
        display: block;
        margin: 20px 0 8px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 14px;
        border: 1px solid #dce4ef;
        border-radius: 9px;
        font-size: 15px;
    }

    button {
        width: 100%;
        margin-top: 20px;
        padding: 14px;
        border: 0;
        border-radius: 9px;
        background: #0866ff;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    button:disabled {
        opacity: .65;
        cursor: wait;
    }

    #message {
        margin-top: 18px;
        font-size: 14px;
        overflow-wrap: anywhere;
    }

    .links {
        margin-top: 22px;
        text-align: center;
    }

    a {
        color: #0866ff;
        text-decoration: none;
        font-weight: bold;
    }
</style>

</head>

<body>
    <main class="card">
        <div class="brand">NEXA</div>

    <h1>Forgot your password?</h1>

    <p>
        Enter the email address associated with your NEXA account.
        If your account is eligible, we will email you a secure
        password-reset link.
    </p>

    <form id="forgotForm">
        <label for="email">Email address</label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            maxlength="255"
            required
        >

        <button id="submitButton" type="submit">
            Send Reset Link
        </button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <div class="links">
        <a href="/login.html">Back to Login</a>
    </div>
</main>

<script>
    const form = document.getElementById('forgotForm');
    const button = document.getElementById('submitButton');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (event) => {
        event.preventDefault();

        button.disabled = true;
        button.textContent = 'Sending...';
        message.textContent = '';

        try {
            const response = await fetch(
                '/api/auth/forgot-password',
                {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: document
                            .getElementById('email')
                            .value.trim()
                    })
                }
            );

            const result = await response.json();

            message.textContent =
                result.message ||
                'If your account is eligible, a reset link will be sent.';

            message.style.color =
                response.ok ? '#138a52' : '#d93025';
        } catch (error) {
            message.textContent =
                'Could not connect to NEXA. Please try again.';
            message.style.color = '#d93025';
        } finally {
            button.disabled = false;
            button.textContent = 'Send Reset Link';
        }
    });
</script>

</body>
</html>
